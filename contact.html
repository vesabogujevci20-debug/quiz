<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Quiz Time!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
        }

        body.dark-mode {
            background-color: #1e1e1e;
            color: #f4f4f4;
        }

        nav {
            background-color: #ffffff;
            border-bottom: 1px solid #ddd;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        body.dark-mode nav {
            background-color: #2b2b2b;
            border-bottom-color: #444;
        }

        nav .nav-brand {
            font-weight: bold;
            font-size: 1.2rem;
            text-decoration: none;
            color: inherit;
        }

        nav .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        nav .nav-links a {
            text-decoration: none;
            color: inherit;
            font-weight: 500;
        }

        nav .nav-links a:hover {
            color: #007bff;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            padding: 24px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        body.dark-mode .container {
            background: #2b2b2b;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        body.dark-mode input[type="text"],
        body.dark-mode input[type="email"],
        body.dark-mode textarea {
            background-color: #333;
            color: #fff;
            border-color: #555;
        }

        .btn {
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        #successMessage {
            display: none;
            color: green;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="mainpage.html" class="nav-brand">QUIZ TIME!</a>
        <div class="nav-links">
            <a href="mainpage.html">Home</a>
            <a href="contact.html">Contact Us</a>
            <button class="btn" onclick="toggleDarkMode()">Toggle Dark Mode</button>
        </div>
    </nav>

    <div class="container">
        <h2>Contact Us</h2>
        <form id="contactForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="Your Name">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" rows="4" required placeholder="Write your message here..."></textarea>
            </div>
            <button type="submit" class="btn">Send Message</button>
        </form>
        <p id="successMessage">Message sent successfully!</p>
    </div>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }

        function handleSubmit(e) {
            e.preventDefault();
            document.getElementById("successMessage").style.display = "block";
            document.getElementById("contactForm").reset();
        }
    </script>
</body>
</html>
